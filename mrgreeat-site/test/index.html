/* ---------- logic (pure) ---------- */
function compute(ans){
  const z={};ORDER.forEach(k=>z[k]={s:0,m:0});
  const flags=[],good=[];
  QS.forEach((q,qi)=>{ if(!q.zone)return; const o=q.o[ans[q.id]]; z[q.zone].s+=o.s; z[q.zone].m+=2;
    if(o.s>0)flags.push({id:q.id,zone:q.zone,s:o.s,r:o.r,qi}); else good.push(o.g); });
  ORDER.forEach(k=>{z[k].good=Math.round((1-z[k].s/z[k].m)*10)}); // 0..10, how much is done right
  const totS=ORDER.reduce((a,k)=>a+z[k].s,0), totM=ORDER.reduce((a,k)=>a+z[k].m,0);
  const score=Math.round((1-totS/totM)*100);
  flags.sort((a,b)=>b.s-a.s||a.qi-b.qi);
  /* weakest zone first; if two zones differ by 1 point or less, the more fundamental one (ORDER: food first) wins */
  const zs=ORDER.slice().sort((a,b)=>{const d=z[a].good-z[b].good;return Math.abs(d)<=1?ORDER.indexOf(a)-ORDER.indexOf(b):d});
  const pick=[];
  zs.forEach(k=>{const f=flags.find(f=>f.zone===k);if(f&&pick.length<3)pick.push(f)});
  flags.forEach(f=>{if(pick.length<3&&!pick.includes(f))pick.push(f)});
  const weak=zs.filter(k=>z[k].good<=7);
  const top=weak.length?weak[0]:'fine';
  const second=weak.length>1?weak[1]:null;
  return {z,score,flags:pick,allFlags:flags.length,good,top,second};
}
function level(g){return g>=8?['ok','В порядке']:g>=5?['mid','Тормозит']:['bad','Главная проблема']}

/* ---------- ui ---------- */
const app=document.getElementById('app');
let step=0, ans={}, timer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(html){app.innerHTML='<section class="screen">'+html+'</section>';window.scrollTo({top:0});}

function intro(){
  render('<p class="label hot">Роман Шипилов · @mr.greeat</p>'+
   '<h1>Почему тренировки не помогают добиться рельефного тела</h1>'+
   '<p class="lead">За 2 минуты ты узнаешь, что именно тормозит твой результат, свой тип и три главные ошибки — и что с ними делать.</p>'+
   '<div class="zonesPreview">'+ORDER.map(k=>'<span class="chip"><i></i>'+ZONES[k].name+'</span>').join('')+'</div>'+
   '<div class="facts"><div><b>'+QS.length+'</b><span>вопросов</span></div><div><b>2 мин</b><span>на тест</span></div><div><b>3</b><span>главные ошибки</span></div></div>'+
   '<button class="btn" type="button" id="go">Пройти тест</button>');
  document.getElementById('go').onclick=()=>{step=0;ans={};question()};
}

function stepsBar(){const n=QS.length;const done=QS.filter(q=>ans[q.id]!==undefined).length;
  return '<div class="steps" style="--n:'+n+'">'+Array.from({length:n},(_,k)=>'<i class="'+(k<done?'done':'')+'"></i>').join('')+'</div>'}

function question(){
  const item=Q[step];
  if(item.fact){return fact(item.fact)}
  const qn=QS.indexOf(item)+1;
  render('<div class="qtop"><button class="btn ghost small" type="button" id="back"'+(step===0?' style="visibility:hidden"':'')+'>← Назад</button><span class="label">'+qn+' / '+QS.length+'</span></div>'+
   stepsBar()+
   '<p class="label hot">'+esc(item.zone?ZONES[item.zone].name:item.label)+'</p>'+
   '<h2 class="qtitle">'+esc(item.t)+'</h2>'+(item.hint?'<p class="qhint">'+esc(item.hint)+'</p>':'')+
   '<div class="opts" role="group" aria-label="Варианты ответа">'+item.o.map((o,k)=>'<button type="button" class="opt'+(ans[item.id]===k?' sel':'')+'" data-k="'+k+'"><span class="k">'+String.fromCharCode(65+k)+'</span><span>'+esc(o.t)+'</span></button>').join('')+'</div>');
  document.getElementById('back').onclick=back;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[item.id]=+b.dataset.k;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));clearTimeout(timer);timer=setTimeout(next,200)});
}
function back(){clearTimeout(timer);do{step--}while(step>0&&Q[step].fact);question()}
function next(){step++; if(step<Q.length)question(); else analysing()}

function fact(id){
  const f=FACTS[id], o=QS.find(q=>q.id===f.q).o[ans[f.q]], bad=o.s>0;
  render(stepsBar()+'<div class="fact"><p class="label">'+(bad?'Знакомо?':'Отлично')+'</p><p>'+(bad?f.bad:f.ok)+'</p><div style="border-top:1px solid var(--slab-line);padding-top:16px"><div class="big">'+f.big+'</div><p style="margin-top:4px">'+f.lab+'</p></div><p class="src">'+f.src+'</p></div>'+
   '<button class="btn" type="button" id="cont">Дальше</button>');
  document.getElementById('cont').onclick=next;
}

function analysing(){
  render('<div class="anal"><p class="label hot">Считаем результат</p><h2>Сверяем твои ответы по 5 зонам</h2><ul>'+ORDER.map(k=>'<li data-z="'+k+'"><span>'+ZONES[k].name+'</span><span class="s">…</span></li>').join('')+'</ul></div>');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items=[...app.querySelectorAll('li')];let n=0;
  const tick=()=>{if(n<items.length){items[n].classList.add('done');items[n].querySelector('.s').textContent='готово';n++;timer=setTimeout(tick,reduce?0:420)}else{timer=setTimeout(result,reduce?0:350)}};
  timer=setTimeout(tick,reduce?0:300);
}

function gauge(score){
  const r=56,c=2*Math.PI*r,col=score>=80?'var(--ok)':score>=55?'var(--mid)':'var(--bad)';
  return '<div class="gauge" role="img" aria-label="Результат '+score+' из 100"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--slab-track)" stroke-width="12"/><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*score/100).toFixed(1)+' '+c.toFixed(1)+'"/></svg><div class="num"><b>'+score+'</b><span>из 100</span></div></div>';
}

function result(){
  const r=compute(ans);
  const goal=QS[0].o[ans.goal].v, dur=QS[1].o[ans.dur].v;
  const durTxt=['меньше 3 месяцев в зале','от 3 месяцев до года в зале','больше года в зале'][dur];
  let desc=TYPES[r.top].d;
  if(r.top!=='fine'&&r.second)desc+=' Вторая слабая зона — «'+ZONES[r.second].name+'».';
  const lead=r.top==='fine'
    ? 'Ты хочешь '+goal+', и по базовым привычкам делаешь почти всё правильно.'
    : (dur===2?'Больше года в зале — значит, дело не в лени и не в силе воли. ':dur===1?'Месяцы в зале без нужного результата — значит, усилий хватает, мешает другое. ':'Хорошо, что ищешь причину сразу, а не через год. ')+'Чтобы '+goal+', начни с ошибок ниже.';

  let html='<div class="hero">'+gauge(r.score)+'<div class="txt"><p class="label">Твой тип</p><h2>'+esc(TYPES[r.top].t)+'</h2><p>'+esc(desc)+'</p></div>'+
   '<div class="meta"><span>Цель: '+esc(goal)+'</span><span>'+durTxt+'</span><span>Ошибок найдено: '+r.allFlags+'</span>'+(r.allFlags>3?'<span>Ниже — 3 главные</span>':'')+'</div></div>'+
   '<p style="font-size:1.05rem">'+esc(lead)+'</p>';

  html+='<div class="block"><p class="label">Твоя карта по 5 зонам</p><div class="zones">'+ORDER.map(k=>{const g=r.z[k].good,[l,t]=level(g);
    return '<div class="zone" data-l="'+l+'"><h3>'+ZONES[k].name+'</h3><span class="st">'+t+' · '+g+'/10</span><div class="meter" role="img" aria-label="'+ZONES[k].name+': '+g+' из 10">'+Array.from({length:10},(_,n)=>'<i class="'+(n<g?'on':'')+'"></i>').join('')+'</div></div>'}).join('')+
   '</div><p class="legend">Чем больше делений, тем больше в зоне сделано правильно.</p></div>';

  if(r.good.length){html+='<div class="block good"><p class="label">Что у тебя уже хорошо</p><ul>'+r.good.slice(0,5).map(g=>'<li><span class="ck">✓</span><span>'+esc(g)+'</span></li>').join('')+(r.good.length>5?'<li><span class="ck">+</span><span>И ещё '+(r.good.length-5)+' — тоже в порядке.</span></li>':'')+'</ul></div>'}

  if(r.flags.length){
    html+='<div class="block"><p class="label">'+(r.flags.length===1?'Что тормозит результат':'Твои главные ошибки')+'</p><div class="cards">'+r.flags.map((f,n)=>{const c=CARDS[f.id];
      return '<article class="card'+(n===0?' main':'')+'"><div class="head"><div class="tag">'+(n===0?'<span class="pill hot">Главное</span>':'<span class="pill">Ошибка '+(n+1)+'</span>')+'<span class="pill">'+ZONES[f.zone].name+'</span></div><h3>'+esc(c.title)+'</h3><p class="you">Твой ответ: '+esc(f.r)+'</p></div>'+
       '<dl><div><dt>Почему это тормозит</dt><dd>'+esc(c.why)+'</dd></div><div><dt>Что сделать сам уже сегодня</dt><dd>'+esc(c.todo)+'</dd></div><div><dt>Где понадобится помощь</dt><dd class="help">'+esc(ZONES[f.zone].help)+'</dd></div></dl></article>'}).join('')+'</div></div>';
  }
  if(r.top==='fine'){
    html+='<div class="block"><p class="label">Что тест не видит</p><div class="card main"><h3>'+(r.allFlags?'Мелочи есть, но дело, скорее всего, не в них':'Базовых ошибок нет — значит, причина глубже')+'</h3><p class="recog">Когда база в порядке, а результата нет, причина обычно в деталях, которые видно только по твоим цифрам за 2–3 недели:</p><dl><div><dt>Что проверить</dt><dd>Сколько ты на самом деле ешь по сравнению с тем, что записываешь. Подходят ли калории и белок именно тебе. Растёт ли нагрузка в нужных упражнениях. Как меняются талия и средний вес по неделям.</dd></div><div><dt>Где понадобится помощь</dt><dd class="help">Разобрать это по твоим данным — ровно то, что я делаю в личной переписке.</dd></div></dl></div></div>';
  }

  const tg='https://t.me/mrgreeatbot?start=t_'+r.top;

   '<p>В боте пришлю, с чего начать именно с твоим типом. А если захочешь — разберу твою ситуацию лично в переписке.</p>'+
   '<div class="act"><a class="btn" href="'+tg+'" target="_blank" rel="noopener">Получить разбор в Telegram</a><span class="handle">Telegram-бот @mrgreeatbot · Instagram @mr.greeat</span></div></div>'+
   '<button class="btn ghost small again" type="button" id="again">Пройти тест заново</button>';
  render(html);
  document.getElementById('again').onclick=()=>{step=0;ans={};question()};
}

window.__quiz={Q,QS,compute,CARDS,FACTS,TYPES};
intro();
})();
